# pi-vision distro: Poky with the policy this device needs.
require conf/distro/poky.conf

DISTRO = "pivision-os"
DISTRO_NAME = "pi-vision"
DISTRO_VERSION = "0.1"

# systemd as init.
INIT_MANAGER = "systemd"

# OpenGL ES through Mesa, no window system: Qt draws straight to the display
# with eglfs on KMS. Dropping x11, wayland and vulkan also cuts build time.
# ptest (packaged test suites) is dropped to keep the build small.
DISTRO_FEATURES:append = " opengl"
DISTRO_FEATURES:remove = "x11 wayland vulkan ptest"

# Optimize for size everywhere, except OpenCV: image processing and DNN
# inference are where the CPU time goes on a 1.2 GHz Pi 3.
FULL_OPTIMIZATION = "-Os -pipe ${DEBUG_FLAGS}"
FULL_OPTIMIZATION:pn-opencv = "-O2 -pipe ${DEBUG_FLAGS}"

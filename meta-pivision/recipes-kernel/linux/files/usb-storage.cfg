# USB sticks, for copying captures off the device (see pivision-usb).
# Built in rather than modules, so the image needs no extra module packages.
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_USB_STORAGE=y
CONFIG_VFAT_FS=y
CONFIG_EXFAT_FS=y
# Code page and character sets FAT mounts use by default.
CONFIG_NLS_CP437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_NLS_UTF8=y

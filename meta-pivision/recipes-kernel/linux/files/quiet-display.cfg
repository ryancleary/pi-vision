# fbcon stays, but only claims the display if the kernel prints something.
# With quiet, it never does: the screen goes from firmware straight to psplash.
# (Turning fbcon off entirely needs CONFIG_EXPERT, since DRM fbdev emulation,
# which psplash draws on, forces it on otherwise.)
CONFIG_FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER=y
# CONFIG_LOGO is not set
#
